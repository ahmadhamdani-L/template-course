targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate copyWith, == and hashCode methods
          equal: true
          # Generate toString method
          to_string_override: true
          # Generate map method
          map: true
          
      json_serializable:
        enabled: true
        options:
          any_map: true
          checked: true
          explicit_to_json: true
          field_rename: snake_case
